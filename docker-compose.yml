services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: venzorah
      POSTGRES_PASSWORD: venzorah
      POSTGRES_DB: venzorah
    volumes:
      - venzorah_pg:/var/lib/postgresql/data

volumes:
  venzorah_pg:
